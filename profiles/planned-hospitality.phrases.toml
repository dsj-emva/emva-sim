# Phrase banks of the planned-hospitality Industry profile (issue #6), referenced from
# planned-hospitality.toml ([text].phrase_bank).
#
# Every list of strings below is a group of phrases. `uv run emva-sim vary-phrases` sends each phrase
# once to Claude Haiku 4.5, which rewrites it into natural variations kept in
# planned-hospitality.variations.json; generation picks among a phrase and its cached variations and
# never calls the model. A phrase is named by its group and its place in it, e.g. "message.en.who.couple#2".
#
# Words in braces are slots the generator fills from the Lead ({adults}, {children}, {party},
# {nights}, {date}, {month}, {year}, {budget}, {countries}, {country}, {park}, {child_ages}) or
# draws ({age}, {age2}, {companion}, {first_name}, {link}). A phrase is used only where every slot
# it names has a value.
#
# Written for this file, illustrative, not copied from any source; tone and contents follow
# docs/research/planned-hospitality/enquiry-forms.md §2 and notes-and-loss-reasons.md §2.
# Meaning carries every planted signal, never a keyword: the words of the commitment phrases also
# appear in phrases that commit to nothing (undecided, questions), and the words of the real-buyer
# notes also appear in notes about leads who are not.

# How each kind of text is written, for the model that varies it.
[about]
message = "an enquiry a traveller types into the free-text box of a tailor-made safari operator's web form: friendly, first person, sometimes imperfect"
notes = "a note a safari operator's sales consultant types into the CRM about a lead: short and telegraphic, often with no subject"
loss_reason = "the reason a safari operator's sales consultant types when closing a lost deal in the CRM: a few words"
spam = "a spam or bot submission in a web form's message box"

# ---------------------------------------------------------------------------------------------------------
