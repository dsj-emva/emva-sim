[message.en]
# Long, wandering sentences (effects.message_length's dreamer); dreamers name many countries.
dreamer = [
  "I have always dreamed of seeing the gorillas in the mist and then flying straight down to watch the great herds crossing the river, and maybe after that a few lazy days somewhere with a pool.",
  "My idea is that we would start somewhere with mountains and forest, move on to the big open plains, and finish somewhere wild and remote where we hardly see anyone else at all.",
  "We would love to see as many different landscapes as we possibly can, deserts and deltas and volcanoes and beaches, because we may only ever do this once and want to make the most of it.",
  "Honestly I keep changing my mind every time I read another blog post, one day it's the desert, the next it's the delta, and the day after that it's the beach and the reef.",
  "In my head the perfect trip has a hot air balloon at sunrise, a sundowner on a sand dune, a canoe on the river and a night under the stars on a sleep-out deck.",
  "We have watched every wildlife documentary going and would love to be in the places they film, with the big cats hunting and the elephants coming down to drink at dusk.",
  "It would be amazing to do a bit of everything: some walking, some boating, a little bit of culture and village life, and of course plenty of game drives with a good guide.",
  "I have a long list of places pinned on a map at home and I'd love to tick off as many as I can, although I know that might not be realistic in one trip.",
  "Maybe we could also see the waterfalls, and the salt pans, and the coast, and if there is time a few days in the city at the end before we fly home.",
  "I would really like to understand how the countries link together, whether it's easy to fly between them, and how many we could reasonably fit in without feeling rushed.",
  "Part of me wants a proper adventure with tents and campfires, and part of me wants the full luxury lodge with a plunge pool, so I'm hoping you can suggest a mix of both.",
  "We are open to anything really, the more variety the better, and we don't mind long days if it means we get to see something incredible at the end of them.",
  "I keep imagining the sound of lions at night, the smell of the bush after rain and the colours of the sky at sunset, and I just want to be there.",
  "Ideally we would also meet some of the people working in conservation, visit a school or a community project, and learn about the history of the places we pass through.",
  "There are so many options that I find it hard to choose, so I would love you to tell me what you would do if it were your trip and you had all the time in the world.",
  "One thing I'd really like is to see the stars properly, far away from any lights, and maybe go on a night drive to spot the animals that only come out after dark.",
]
