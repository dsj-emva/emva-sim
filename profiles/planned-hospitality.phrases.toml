# The note after a long discovery call (notes.long_discovery_share): what was talked through, no
# judgement.
discovery_call = [
  "Long call with them about the trip. {party} people, thinking {countries}, about {nights} nights. Talked through camps versus lodges, fly-in versus road transfers and what a typical day looks like. Explained how the rates work per person per night and what fully inclusive covers. They asked about malaria, visas and the weather, all covered. Sending some first ideas with sample camps and rough costs so they can compare.",
  "Discovery call, roughly forty minutes. Went through who is travelling ({party} people), how long ({nights} nights) and where ({countries}). Discussed the balance of game drives and down time, private vehicle options and whether to add a beach stay at the end. Covered deposit and balance timings, flights and transfers. Agreed I would put together an itinerary with two options at different price points.",
  "Good long chat about {countries}. {party} people, {nights} nights. Covered the best areas for the time of year, how busy the parks get, small camps versus bigger lodges and what fully inclusive means at each. They had questions about guiding, vehicle seating and luggage limits on the light aircraft, which I answered. Next step is a draft itinerary with costs per person.",
  "Call went through everything on the form and more. {party} people, about {nights} nights, destinations still open. We talked about the regions that would suit, the difference between camps and lodges, what a day on safari looks like and how the flights between camps work. Explained pricing per person per night and the deposit. They asked sensible questions about health and insurance. Ideas to follow by email.",
]

