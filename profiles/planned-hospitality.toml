# ---------------------------------------------------------------------------------------------------------
# The enquiry form.
# Field labels are what the form shows; the export columns below carry them.
# ---------------------------------------------------------------------------------------------------------

[form]
source = "enquiry-forms.md §1: fields seen on 12 operator forms (Expert Africa, Go2Africa, Rhino Africa, Steppes, Audley, Scott Dunn, &Beyond, Cazenove+Loyd, Natural Selection, Porini, SafariBookings, Noboru); budget bands after Go2Africa and Scott Dunn"

# "role" says what a field asks and an option's "key", "min"/"max" or "not_sure" what it means, so the
# generator reads none of this form's wording. A band holds values from min (inclusive) to max (exclusive).
[[form.fields]]
label = "Title"
role = "title"
kind = "choice"
required = true
options = [
  { label = "Mr", key = "mr" },
  { label = "Mrs", key = "mrs" },
  { label = "Ms", key = "ms" },
  { label = "Miss", key = "miss" },
  { label = "Dr", key = "dr" },
  { label = "Mx", key = "mx" },
]

