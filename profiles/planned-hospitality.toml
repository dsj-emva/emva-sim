label = "First name"
role = "first_name"
kind = "text"
required = true

[[form.fields]]
label = "Last name"
role = "last_name"
kind = "text"
required = true

[[form.fields]]
label = "Email"
role = "email"
kind = "email"
required = true

[[form.fields]]
label = "Phone"
role = "phone"
kind = "phone"
required = false

[[form.fields]]
