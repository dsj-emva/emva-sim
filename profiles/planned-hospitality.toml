# ---------------------------------------------------------------------------------------------------------
# The enquiry form.
# Field labels are what the form shows; the export columns below carry them.
# ---------------------------------------------------------------------------------------------------------

[form]
fields = [
  { label = "Title", role = "title", kind = "choice", options = ["Mr", "Mrs", "Ms", "Miss", "Dr", "Mx"], required = true },
  { label = "First name", role = "first_name", kind = "text", required = true },
  { label = "Last name", role = "last_name", kind = "text", required = true },
  { label = "Email", role = "email", kind = "email", required = true },
  { label = "Phone", role = "phone", kind = "phone", required = false },
  { label = "Country of residence", role = "country", kind = "country", required = true },
  { label = "Where would you like to go?", role = "destinations", kind = "multi", options = ["Kenya", "Tanzania", "Botswana", "South Africa", "Rwanda", "Uganda", "Namibia", "Zambia", "Zimbabwe", "Not sure yet"], required = true },
  { label = "When would you like to travel?", role = "travel_date", kind = "month_year", allow = ["exact dates", "month", "year only", "not sure"], required = true },
  { label = "Are your dates flexible?", role = "dates_flexible", kind = "choice", options = ["Fixed", "Flexible", "Not sure"], required = false },
  { label = "Number of nights", role = "nights", kind = "choice", options = ["Under 5", "5-7", "8-10", "11-14", "15+", "Not sure"], required = false },
  { label = "Number of adults", role = "adults", kind = "number", required = true },
  { label = "Number of children", role = "children", kind = "number", required = false },
  { label = "Ages of children", role = "children_ages", kind = "text", required = false },
  { label = "Accommodation style", role = "style", kind = "choice", options = ["Comfortable", "Luxury", "Ultra-luxury", "Not sure"], required = false },
  { label = "Budget per person (excluding international flights)", role = "budget_per_person", kind = "choice", options = ["Under $4,000", "$4,000 - $7,000", "$7,000 - $10,000", "$10,000 - $20,000", "$20,000+", "Not sure"], required = false },
  { label = "Have you travelled with us before?", role = "travelled_before", kind = "choice", options = ["Yes", "I have enquired before", "No"], required = false },
  { label = "How did you hear about us?", role = "heard_about", kind = "choice", options = ["Google", "Instagram", "Facebook", "Recommended by a friend", "Travelled with you before", "Magazine", "Travel agent", "ChatGPT or another AI assistant", "Other"], required = false },
