# ---------------------------------------------------------------------------------------------------------
# Planted effects. Sizes are odds ratios on winning, against the named reference, unless stated. The base
# odds are set so the transition rates above hold on average. "visible" says whether a lead carries the
# signal at submission or only at a later Stage.
# ---------------------------------------------------------------------------------------------------------

# 1. Budget floor: stated budget per person per night against the floor of the style asked for (threshold).
[effects.budget_floor]
form = "threshold"
visible = "submission"
floor_luxury_per_night = { low = 800, middle = 900, high = 1000, confidence = "estimated", source = "what-predicts-a-booking.md §1: practitioner floor for luxury (Travel Market Report, search extract only)" }
below_half = { low = 0.03, middle = 0.10, high = 0.25, confidence = "guessed", source = "none" }
half_to_floor = { low = 0.30, middle = 0.50, high = 0.80, confidence = "guessed", source = "none" }
note = "reference: at or above the floor; no further lift above 1.5x the floor; repeat clients feel half the penalty"

# 2. No budget stated (additive).
[effects.no_budget]
form = "additive"
visible = "submission"
odds_ratio = { low = 0.50, middle = 0.70, high = 0.90, confidence = "guessed", source = "none" }
note = "reference: a stated budget at or above the floor; missing is not below the floor"

# 3. Lead time x travel season (interaction, inverted U).
[effects.lead_time_by_season]
form = "interaction"
visible = "submission"
peak_months = [7, 8, 9, 10]
peak_under_4_months = { low = 0.20, middle = 0.40, high = 0.70, confidence = "guessed", source = "none; shape from operator lead-time advice (Rhino Africa, Yellow Zebra)" }
off_peak_under_4_months = { low = 0.8, middle = 1.0, high = 1.2, confidence = "guessed", source = "none" }
over_18_months_or_unsure = { low = 0.40, middle = 0.60, high = 0.85, confidence = "guessed", source = "none" }
note = "reference: peak 6-14 months ahead, off-peak 1-8 months ahead"

# 4. Date specificity (ordered, additive).
[effects.date_specificity]
form = "additive"
visible = "submission"
no_dates = { low = 0.35, middle = 0.55, high = 0.80, confidence = "guessed", source = "none" }
month_only = { low = 0.75, middle = 0.90, high = 1.0, confidence = "guessed", source = "none" }
note = "reference: exact dates"

# 5. Lead source (additive).
[effects.lead_source]
form = "additive"
visible = "submission"
referral = { low = 1.5, middle = 2.5, high = 4.0, confidence = "guessed", source = "what-predicts-a-booking.md §3: vendor ranges, unsourced; Runggaldier et al. 2023 spread by source 1-91%" }
paid_social = { low = 0.4, middle = 0.6, high = 0.9, confidence = "guessed", source = "none" }
organic = { low = 1.0, middle = 1.4, high = 2.0, confidence = "guessed", source = "none" }
note = "reference: paid search"

# 6. Repeat client (additive, and halves the budget-floor penalty).
[effects.repeat_client]
form = "additive"
visible = "submission"
odds_ratio = { low = 2.0, middle = 3.5, high = 6.0, confidence = "guessed", source = "what-predicts-a-booking.md §3 (60-70% vs 5-20% claim untraced)" }
share_of_leads = { low = 0.03, middle = 0.08, high = 0.15, confidence = "guessed", source = "none" }

# 7. Response speed x lead quality: advertiser behaviour, not a property of the lead (interaction).
[effects.response_speed_by_quality]
form = "interaction"
visible = "contact attempted"
high_quality_within_1h = { low = 1.5, middle = 2.5, high = 4.0, confidence = "guessed", source = "what-predicts-a-booking.md §4: direction from HBR, MIT, Telfer (contact and qualification, not bookings)" }
low_quality_within_1h = { low = 1.0, middle = 1.1, high = 1.3, confidence = "guessed", source = "none" }
note = "reference: first attempt after 24 h; high quality is the top third of hidden quality"

# 8. Message length and specificity (inverted U).
[effects.message_length]
form = "inverted_u"
visible = "submission"
under_15_words = { low = 0.40, middle = 0.60, high = 0.85, confidence = "guessed", source = "none" }
dreamer = { low = 0.55, middle = 0.75, high = 0.95, confidence = "guessed", source = "none" }
note = "reference: 40-200 specific words; dreamer: over 400 words, no budget, over 3 countries. Read from meaning, never a giveaway keyword"

# 9. Party size x trip type (interaction).
[effects.party_size_by_segment]
form = "interaction"
visible = "submission"
safari_over_6 = { low = 0.50, middle = 0.70, high = 0.90, confidence = "guessed", source = "what-predicts-a-booking.md §6: direction from Runggaldier et al. 2023" }
note = "reference: a safari party of 2; no effect for corporate segments, where size goes to Deal value"

# 10. Phone given, only where phone is optional (context-dependent).
[effects.phone_given]
form = "context"
visible = "submission"
odds_ratio_when_optional = { low = 1.2, middle = 1.5, high = 2.0, confidence = "guessed", source = "what-predicts-a-booking.md: form-field case studies (Vital Design, Disruptive Advertising)" }
note = "no effect on the corporate form, where phone is required"

# 11. Corporate: broadcast request vs direct, by decision maker (interaction).
[effects.corporate_broadcast_by_decision_maker]
form = "interaction"
visible = "submission"
broadcast_share = { low = 0.30, middle = 0.50, high = 0.70, confidence = "guessed", source = "none" }
broadcast_vs_direct = { low = 0.15, middle = 0.30, high = 0.50, confidence = "estimated", source = "what-predicts-a-booking.md §7: broadcast win 4-15% vs direct 15-40%" }
decision_maker_direct = { low = 1.5, middle = 2.0, high = 3.0, confidence = "guessed", source = "none" }
decision_maker_broadcast = { low = 1.0, middle = 1.3, high = 1.6, confidence = "guessed", source = "none" }

# 12. A dated price rise x budget (changes over time).
[effects.price_rise]
form = "time_varying"
visible = "submission"
at_month_of_history = 14
floor_rise = { low = 0.05, middle = 0.10, high = 0.20, confidence = "guessed", source = "what-predicts-a-booking.md §8: Maasai Mara fee rise to $200 (July 2024)" }
near_floor_after = { low = 0.55, middle = 0.75, high = 0.90, confidence = "guessed", source = "none" }
note = "after the rise, leads within 1.0-1.3x of the old floor; leads above 1.5x unaffected"

# 13. Planted in text: meaning carries the signal, never a keyword (issue #6).
[effects.text_commitment]
form = "text"
visible = "submission"
odds_ratio = { low = 1.3, middle = 1.8, high = 2.5, confidence = "guessed", source = "none; notes-and-loss-reasons.md §2 on meaning over keywords" }
note = "the enquiry shows a decision already made (leave booked, flights held, partner agreed) in varied words"

# 14. Planted in Sales notes after contact: a real buyer vs one who is not.
[effects.notes_real_buyer]
form = "text"
visible = "engaged"
odds_ratio = { low = 2.0, middle = 3.0, high = 5.0, confidence = "guessed", source = "none (notes-and-loss-reasons.md illustrative notes)" }

# T. Proxy trap: country-of-residence group shifts budget and lead time, and has no effect of its own.
[effects.proxy_trap_country]
form = "confounded"
visible = "submission"
