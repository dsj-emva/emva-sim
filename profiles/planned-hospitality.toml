budget_multiplier = { low = 1.3, middle = 1.6, high = 2.0, confidence = "guessed", source = "what-predicts-a-booking.md §9: origin predicts strongly (Runggaldier et al. 2023); Go2Africa spend by country" }
lead_time_multiplier = { low = 1.2, middle = 1.5, high = 2.0, confidence = "guessed", source = "none" }
note = "direct effect on the Outcome is zero at every end; carried by Country of residence, phone country code and enquiry language"
