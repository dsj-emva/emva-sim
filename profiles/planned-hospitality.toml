# ---------------------------------------------------------------------------------------------------------
# The sales process: the business's own steps, mapped onto the Canonical ladder.
# Won is the deposit paid (sales-steps-and-exports.md §2: SafariOffice and Tripleseat count the deposit).
# ---------------------------------------------------------------------------------------------------------

[[pipelines]]
name = "Safari Enquiries"
segments = ["safari"]
stages = [
  { name = "New Enquiry", ladder = "Submitted" },
  { name = "Attempting Contact", ladder = "Contact attempted" },
  { name = "In Discussion", ladder = "Engaged" },
  { name = "Planning", ladder = "Qualified" },
  { name = "Itinerary Sent", ladder = "Proposal" },
  { name = "Provisional Hold", ladder = "Proposal", milestone = true },
  { name = "Deposit Paid", ladder = "Won", closed = "won" },
  { name = "Travelled", ladder = "Won", after_won = true },
  { name = "Lost", ladder = "Lost", closed = "lost" },
]
source = "sales-steps-and-exports.md §2: Safari Portal, SafariOffice, TripCreator, Zoho travel templates"

[[pipelines]]
name = "Corporate & Events"
segments = ["incentive", "event"]
stages = [
  { name = "New Request", ladder = "Submitted" },
  { name = "Brief Call", ladder = "Engaged" },
  { name = "Qualified", ladder = "Qualified" },
  { name = "Proposal Sent", ladder = "Proposal" },
  { name = "Contract Out", ladder = "Proposal", milestone = true },
  { name = "Contract Signed", ladder = "Won", closed = "won" },
  { name = "Closed Lost", ladder = "Lost", closed = "lost" },
]
source = "sales-steps-and-exports.md §2: Tripleseat statuses, HubSpot default pipeline"

