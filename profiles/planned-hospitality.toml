# Hours to the first Contact attempt, in two pieces (issue #5, ruled 2026-10-01):
# - below late_after_hours, a lognormal fitted to first_attempt_delay_median_hours and to the share after
#   late_after_hours (first_attempt_after_24h), so both numbers hold;
# - a late first attempt (that share) is log-uniform between late_after_hours and the lead's days to Won, so
#   every first attempt comes before the lead's cycle would end and no tail runs off the calendar.
# The two numbers must agree: a median below late_after_hours needs a share after it below one half.
[handling]
