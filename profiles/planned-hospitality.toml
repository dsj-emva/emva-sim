# Industry profile: planned hospitality
#
# One advertiser: a tailor-made safari operator (East and Southern Africa, selling to travellers in the UK,
# the US and Europe). Corporate trips and events get their own profile later. Every industry-specific fact the
# generator and the Lead simulator need lives here (decision 0007).
#
# Every uncertain number is a range:
#   { low, middle, high, confidence, source }
#   confidence: "sourced"   a cited source states it (or numbers it follows from directly)
#               "estimated" worked out from cited sources that do not state it
#               "guessed"   no usable source; a reasoned judgement
#   source:     the research note it came from (docs/research/planned-hospitality/) and the outside source,
#               or "none" for a guess. The user's experience counts as a source: "estimated" when it comes
#               from a client they have worked with, "guessed" when they called it a guess.
# "low" and "high" are the low and high numbers, whatever their effect. Which ranges are swept is in [sweep].
#
# Facts that are not uncertain (column names, CRM stage names, field options) are plain values. Thresholds
# that set the shape of an effect (bands, months, cut-offs) are fixed (user ruling 2026-10-01); only effect
# sizes are ranges. Rates are shares between 0 and 1. Every number from data generated from this profile is "on simulated data".

name = "planned-hospitality"
currency = "USD"

# ---------------------------------------------------------------------------------------------------------
# Which ranges are swept (user ruling 2026-10-01, fixed before any phase 2 result exists). Datasets: the
# middle; each range below at its low and at its high, one at a time, every other range at its middle; every
# range low together; every range high together. Ranges that only describe the business are held at their
# middle except in the two extremes.
# ---------------------------------------------------------------------------------------------------------

