# Industry profile: planned hospitality
#
# One advertiser: a tailor-made safari operator (East and Southern Africa, selling to travellers in the UK,
# the US and Europe) that also sells corporate incentive trips and events. Every industry-specific fact the
# generator and the Lead simulator need lives here (decision 0007).
#
# Every uncertain number is a range:
#   { low, middle, high, confidence, source }
#   confidence: "sourced"   a cited source states it (or numbers it follows from directly)
#               "estimated" worked out from cited sources that do not state it
#               "guessed"   no usable source; a reasoned judgement
#   source:     the research note it came from (docs/research/planned-hospitality/) and the outside source,
#               or "none" for a guess.
# Datasets are generated at the middle, at each range's low and high one at a time, and with every range low
# together and every range high together. "low" and "high" are the low and high numbers, whatever their effect.
#
# Facts that are not uncertain (column names, stage names, field options) are plain values. Money is USD.
# Rates are shares between 0 and 1. Every number from data generated from this profile is "on simulated data".

name = "planned-hospitality"
currency = "USD"

# ---------------------------------------------------------------------------------------------------------
# Segments: the three kinds of enquiry this advertiser receives.
# ---------------------------------------------------------------------------------------------------------

[segments]
names = ["safari", "incentive", "event"]

