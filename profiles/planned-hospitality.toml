# ---------------------------------------------------------------------------------------------------------
# Markets and the travel season: facts the base draws and the planted effects both read.
# ---------------------------------------------------------------------------------------------------------

[season]
peak_months = [7, 8, 9, 10]

# Source markets: group A is the US, group B the UK and Europe. Each names the seasonality it follows and
# its countries, each country with the phone formats its leads write ("#" is any digit). The formats use
# the ranges regulators reserve for fiction (Ofcom 07700 900xxx, US 555-01xx, ARCEP 06 39 98 xx xx), so no
# number belongs to anyone.
[markets.groups.a]
seasonality = "us"
countries = [
  { name = "United States", phones = ["+1 (212) 555-01##", "+1 (312) 555-01##", "+1 (415) 555-01##", "+1 (617) 555-01##", "+1 (303) 555-01##"] },
]

[markets.groups.b]
seasonality = "uk_europe"
countries = [
  { name = "United Kingdom", phones = ["+44 7700 900###"] },
  { name = "France", phones = ["+33 6 39 98 ## ##"] },
]

[markets.group_a_share]
low = 0.30
middle = 0.50
high = 0.70
confidence = "guessed"
source = "none"

