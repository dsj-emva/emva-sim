# ---------------------------------------------------------------------------------------------------------
# Prohibited inputs and Intent signals (decision 0008). The generator plants prohibited inputs in fields and
# text so the formatter's removal and the proxy check can be tested; none of them affects the hidden truth
# except through the Intent signals named in the proxy trap.
# ---------------------------------------------------------------------------------------------------------

[prohibited_inputs]
fields = ["Title", "First name", "Last name", "Ages of children", "Country of residence"]
parts_of_fields = ["the country code of Phone", "the name part of Email"]
in_text = ["ages of travellers", "named birthdays (e.g. 60th)", "retirement", "dietary needs tied to religion", "health and mobility needs", "pregnancy", "sexual orientation (e.g. a same-sex partner)", "names of travellers", "the language the enquiry is written in"]
note = "country of residence, phone country code and enquiry language are national-origin proxies (user ruling 2026-10-01); counts of adults and children are Intent signals, children's ages are not; marital status is not planted"
source = "enquiry-forms.md §4; what-predicts-a-booking.md §9"

[intent_signals]
fields = ["Where would you like to go?", "When would you like to travel?", "Are your dates flexible?", "Number of nights", "Number of adults", "Number of children", "Accommodation style", "Budget per person (excluding international flights)", "Have you travelled with us before?", "How did you hear about us?"]
in_text = ["occasion (honeymoon, anniversary)", "named parks, camps and lodges", "must-dos", "flights already booked", "specificity and length"]
source = "enquiry-forms.md §4"

