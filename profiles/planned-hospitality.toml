# ---------------------------------------------------------------------------------------------------------
# The enquiry form. Two forms feed the sales system: the safari form and the corporate form.
# Field labels are what the form shows; the export columns below carry them.
# ---------------------------------------------------------------------------------------------------------

[form.safari]
fields = [
  { label = "Title", kind = "choice", options = ["Mr", "Mrs", "Ms", "Miss", "Dr", "Mx"], required = true },
  { label = "First name", kind = "text", required = true },
  { label = "Last name", kind = "text", required = true },
  { label = "Email", kind = "email", required = true },
  { label = "Phone", kind = "phone", required = false },
  { label = "Country of residence", kind = "country", required = true },
  { label = "Where would you like to go?", kind = "multi", options = ["Kenya", "Tanzania", "Botswana", "South Africa", "Rwanda", "Uganda", "Namibia", "Zambia", "Zimbabwe", "Not sure yet"], required = true },
  { label = "When would you like to travel?", kind = "month_year", allow = ["exact dates", "month", "year only", "not sure"], required = true },
  { label = "Are your dates flexible?", kind = "choice", options = ["Fixed", "Flexible", "Not sure"], required = false },
  { label = "Number of nights", kind = "choice", options = ["Under 5", "5-7", "8-10", "11-14", "15+", "Not sure"], required = false },
  { label = "Number of adults", kind = "number", required = true },
  { label = "Number of children", kind = "number", required = false },
  { label = "Ages of children", kind = "text", required = false },
  { label = "Accommodation style", kind = "choice", options = ["Comfortable", "Luxury", "Ultra-luxury", "Not sure"], required = false },
  { label = "Budget per person (excluding international flights)", kind = "choice", options = ["Under $4,000", "$4,000 - $7,000", "$7,000 - $10,000", "$10,000 - $20,000", "$20,000+", "Not sure"], required = false },
  { label = "Have you travelled with us before?", kind = "choice", options = ["Yes", "I have enquired before", "No"], required = false },
  { label = "How did you hear about us?", kind = "choice", options = ["Google", "Instagram", "Facebook", "Recommended by a friend", "Travelled with you before", "Magazine", "Travel agent", "ChatGPT or another AI assistant", "Other"], required = false },
  { label = "Tell us about your dream trip", kind = "long_text", required = false },
  { label = "Sign me up for the newsletter", kind = "checkbox", required = false },
]
source = "enquiry-forms.md §1: fields seen on 12 operator forms (Expert Africa, Go2Africa, Rhino Africa, Steppes, Audley, Scott Dunn, &Beyond, Cazenove+Loyd, Natural Selection, Porini, SafariBookings, Noboru); budget bands after Go2Africa and Scott Dunn"

[form.corporate]
fields = [
  { label = "First name", kind = "text", required = true },
  { label = "Last name", kind = "text", required = true },
  { label = "Email", kind = "email", required = true },
  { label = "Phone", kind = "phone", required = true },
  { label = "Company", kind = "text", required = true },
  { label = "Job title", kind = "text", required = false },
  { label = "Are you the decision maker?", kind = "choice", options = ["Yes", "No", "Shared decision"], required = false },
  { label = "Programme type", kind = "choice", options = ["Incentive", "Meeting", "Conference", "Event", "Product Launch", "Team Retreat", "Other"], required = true },
  { label = "Expected number of delegates", kind = "text", required = true },
  { label = "Preferred dates", kind = "text", required = true },
  { label = "Budget per participant", kind = "text", required = false },
  { label = "Event vision and support needs", kind = "long_text", required = true },
]
source = "enquiry-forms.md §1 corporate: Euromic DMC RFP form, Bespoke Connects form, Cvent RFP guidance"

